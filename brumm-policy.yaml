name: production-safeguards
version: "1.0"
defaultEffect: DENY

rules:
  # 1. Critical asset protection: Deny root wiping
  - id: deny-root-wipe
    effect: DENY
    isCriticalProtection: true
    agent: "*"
    action: "delete"
    resource: "/data/*"
    environment: "production"
    reasons:
      - "Root-level wipe of production data storage is strictly prohibited"

  # 2. Cleanup agent rule:
  #    - Up to 50GB: Autonomous execution (with snapshot)
  #    - 50GB - 1TB: Escalate to human supervisor
  #    - > 1TB or > 1,000 objects: Hard DENY
  - id: cleanup-agent-policy
    effect: ALLOW
    agent: "cleanup-agent"
    action: "delete"
    resource: "backup-prod/**"
    environment: "production"
    constraints:
      approval_above: "50GB"
      absolute_max_size: "1TB"
      max_objects: 1000
      require_snapshot: true

  # 3. Read operations permitted across non-sensitive zones
  - id: allow-general-read
    effect: ALLOW
    agent: "*"
    action: "read"
    resource: "**"
    environment: "*"

  # 4. Staging environment operations permitted
  - id: allow-staging-environment
    effect: ALLOW
    agent: "*"
    action: "*"
    resource: "**"
    environment: "staging"
